<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>擬似リアルタイム相撲</title>
<style>
  :root{
    --washi:#F2E8D5;
    --washi-dark:#E7D9BC;
    --clay:#D9AE78;
    --clay-dark:#B8875099;
    --rope:#7A4A24;
    --ink:#2B2320;
    --vermillion:#B8402B;
    --vermillion-dark:#8F2F1F;
    --blue:#2C4A6E;
    --gold:#C79A3C;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{height:100%;margin:0;overscroll-behavior:none;}
  body{
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    color:var(--ink);
    background:
      radial-gradient(circle at 15% 20%, #ffffff22 0, transparent 45%),
      radial-gradient(circle at 85% 80%, #ffffff22 0, transparent 45%),
      var(--washi);
    height:100dvh;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  #app{
    position:relative;
    width:100%;
    max-width:480px;
    height:100dvh;
    max-height:900px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:16px;
  }
  .screen{
    width:100%;
    height:100%;
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:22px;
    text-align:center;
  }
  .screen.active{display:flex;}
  h1.title{
    font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
    font-size:2.2rem;
    letter-spacing:.12em;
    margin:0;
    color:var(--ink);
  }
  h1.title .accent{color:var(--vermillion); display:block; font-size:1.1rem; letter-spacing:.4em; margin-bottom:6px;}
  .card{
    background:#fffdf8cc;
    border:1px solid var(--clay-dark);
    border-radius:6px;
    padding:28px 22px;
    width:100%;
    max-width:340px;
    box-shadow:0 6px 18px #0000000f;
  }
  input[type=text]{
    width:100%;
    font-size:1rem;
    padding:12px 14px;
    border:1px solid var(--clay-dark);
    border-radius:4px;
    background:#fff;
    color:var(--ink);
    margin-bottom:16px;
    text-align:center;
  }
  input[type=text]:focus{outline:2px solid var(--vermillion); outline-offset:1px;}
  button{
    font-family:inherit;
    font-size:1rem;
    font-weight:700;
    letter-spacing:.05em;
    border:none;
    border-radius:4px;
    padding:14px 20px;
    cursor:pointer;
    color:#fff;
    background:var(--vermillion);
    width:100%;
    transition:transform .08s ease, background .15s ease;
  }
  button:active{transform:scale(.97); background:var(--vermillion-dark);}
  button:focus-visible{outline:2px solid var(--gold); outline-offset:2px;}
  button.secondary{background:transparent; color:var(--ink); border:1px solid var(--clay-dark);}
  button:disabled{opacity:.45; cursor:default;}
  .hint{font-size:.8rem; color:#6b5c47; line-height:1.6;}
  .spinner{
    width:46px;height:46px;
    border:4px solid var(--clay-dark);
    border-top-color:var(--vermillion);
    border-radius:50%;
    animation:spin 1s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  #matchScreen{justify-content:flex-start; padding-top:6px; gap:8px;}
  .hpRow{
    width:100%;
    max-width:420px;
    display:flex;
    justify-content:space-between;
    gap:10px;
    padding:0 4px;
  }
  .hpBlock{flex:1; text-align:left;}
  .hpBlock.right{text-align:right;}
  .hpLabel{font-size:.72rem; font-weight:700; margin-bottom:3px; color:#6b5c47;}
  .hpBar{
    height:10px;
    border-radius:5px;
    background:#00000018;
    overflow:hidden;
    border:1px solid #00000022;
  }
  .hpFill{height:100%; background:linear-gradient(90deg,var(--vermillion),#d9603f); transition:width .15s ease;}
  .hpFill.blue{background:linear-gradient(90deg,var(--blue),#4a76a8);}
  .hpBlock.right .hpFill{margin-left:auto;}
  canvas{
    width:auto;
    height:min(38vh, 340px);
    max-width:100%;
    aspect-ratio:1/1;
    touch-action:none;
    border-radius:8px;
    flex:0 1 auto;
    display:block;
    margin:0 auto;
  }
  .controls{
    width:100%;
    max-width:420px;
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    padding:4px 6px 6px;
    flex:0 0 auto;
  }
  .stickZone{
    width:96px;height:96px;
    border-radius:50%;
    background:#00000012;
    border:1px solid #00000022;
    position:relative;
    touch-action:none;
    flex:0 0 auto;
  }
  .stickKnob{
    width:38px;height:38px;
    border-radius:50%;
    background:var(--ink);
    opacity:.75;
    position:absolute;
    left:29px; top:29px;
    pointer-events:none;
  }
  .pushWrap{display:flex; flex-direction:column; align-items:center; gap:6px; flex:0 0 auto;}
  .chargeMeter{
    width:14px; height:60px;
    border-radius:7px;
    background:#00000012;
    border:1px solid #00000022;
    display:flex;
    align-items:flex-end;
    overflow:hidden;
  }
  .chargeFill{width:100%; height:0%; background:linear-gradient(0deg,var(--gold),var(--vermillion)); transition:height .05s linear;}
  .pushBtn{
    width:84px;height:84px;
    border-radius:50%;
    background:var(--vermillion);
    color:#fff;
    font-weight:700;
    font-size:1rem;
    letter-spacing:.1em;
    display:flex;align-items:center;justify-content:center;
    touch-action:none;
    box-shadow:0 4px 10px #0000002a;
  }
  .pushBtn.charging{background:var(--vermillion-dark); transform:scale(.95);}
  .statusLine{font-size:.85rem; color:#6b5c47; min-height:1.2em;}
  #resultScreen .resultWord{
    font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
    font-size:2.6rem;
    letter-spacing:.15em;
  }
  #resultScreen .resultWord.win{color:var(--vermillion);}
  #resultScreen .resultWord.lose{color:#5a5148;}
  .row{display:flex; gap:10px; width:100%; max-width:340px;}
  .cpuDiffBtn{flex:1; width:auto; padding:10px 6px; font-size:.85rem;}
</style>
</head>
<body>
<div id="app">

  <div class="screen active" id="nameScreen">
    <h1 class="title"><span class="accent">対戦相撲</span>擬似リアルタイム土俵</h1>
    <div class="card">
      <input type="text" id="nameInput" maxlength="10" placeholder="しこ名を入力(10文字まで)">
      <button id="findBtn">対戦相手を探す</button>
      <div class="hint" style="margin:14px 0 6px;">CPUと対戦(テスト・強さを選択)</div>
      <div class="row" style="max-width:none;">
        <button class="secondary cpuDiffBtn" data-diff="easy">弱い</button>
        <button class="secondary cpuDiffBtn" data-diff="normal">普通</button>
        <button class="secondary cpuDiffBtn" data-diff="hard">強い</button>
      </div>
    </div>
    <div class="hint">同じロビーにいる先着2名がマッチします。<br>通信はポーリング方式のため、動きは少し遅延します。</div>
  </div>

  <div class="screen" id="searchScreen">
    <div class="spinner"></div>
    <div>対戦相手を探しています…</div>
    <button class="secondary" id="cancelSearchBtn" style="max-width:200px;">やめる</button>
  </div>

  <div class="screen" id="matchScreen">
    <div class="hpRow">
      <div class="hpBlock">
        <div class="hpLabel" id="myLabel">あなた</div>
        <div class="hpBar"><div class="hpFill blue" id="myHpFill" style="width:100%"></div></div>
        <div class="hpLabel" style="font-weight:400; opacity:.7;">スタミナ(低いと突進力低下)</div>
      </div>
      <div class="hpBlock right">
        <div class="hpLabel" id="oppLabel">相手</div>
        <div class="hpBar"><div class="hpFill" id="oppHpFill" style="width:100%"></div></div>
        <div class="hpLabel" style="font-weight:400; opacity:.7;">スタミナ</div>
      </div>
    </div>
    <canvas id="ring" width="420" height="420"></canvas>
    <div class="statusLine" id="statusLine">はっけよい、のこった!</div>
    <div class="hint" style="max-width:340px; line-height:1.4; font-size:.72rem;">相手方向=押し/突っ張り・逆=引き落とし・横=はたき込み/上手投げ</div>
    <div class="controls">
      <div class="stickZone" id="stickZone"><div class="stickKnob" id="stickKnob"></div></div>
      <div class="pushWrap">
        <div class="chargeMeter"><div class="chargeFill" id="chargeFill"></div></div>
        <div class="pushBtn" id="pushBtn">押す</div>
      </div>
    </div>
  </div>

  <div class="screen" id="resultScreen">
    <div class="resultWord" id="resultWord">勝ち</div>
    <div class="hint" id="resultHint"></div>
    <div class="row">
      <button id="rematchBtn">もう一度対戦</button>
    </div>
  </div>

</div>

<script>
(function(){
  // ---------- utility ----------
  function uid(){
    if (crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'id-' + Math.random().toString(36).slice(2) + Date.now();
  }
  async function sget(key){
    try{
      const r = await window.storage.get(key, true);
      return r ? JSON.parse(r.value) : null;
    }catch(e){ return null; }
  }
  async function sset(key, val){
    try{ await window.storage.set(key, JSON.stringify(val), true); }catch(e){}
  }

  const myId = uid();
  let myName = '相撲取り';
  let role = null;        // 1 = authority(先に待っていた側) / 2 = 追随側
  let matchId = null;
  let opponentName = '相手';
  let cpuMode = false;
  let cpuAiTimer = null;
  let cpuNextActionAt = 0;

  const R_PLAYER = 24;
  const R_RING = 150;
  const MIN_DIST = R_PLAYER * 2;

  let localState = null;  // role1が権威となるゲーム状態
  let simTimer = null;
  let renderTimer = null;
  let inviteTimer = null;
  let staleWatchTimer = null;
  let lastStateSeenAt = 0;

  const myInput = { dx:0, dy:0, releaseSeq:0, releaseDx:0, releaseDy:0, releasePower:0 };
  let remoteInput2 = { dx:0, dy:0 };
  let lastInputSentAt = 0;
  let lastSeenOppSeq = 0;
  let localReleaseSeq = 0;

  // ---------- screens ----------
  function show(id){
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  // ---------- name / search ----------
  const nameInput = document.getElementById('nameInput');
  document.getElementById('findBtn').addEventListener('click', ()=>{
    const v = nameInput.value.trim();
    myName = v || ('力士' + Math.floor(Math.random()*900+100));
    findMatch();
  });

  let waitingSince = 0;
  let cancelled = false;

  async function findMatch(){
    cancelled = false;
    cpuMode = false;
    show('searchScreen');
    const lobby = await sget('sumo:lobby');
    const now = Date.now();
    if (lobby && lobby.id && lobby.id !== myId && (now - lobby.ts) < 9000){
      // 既に誰か待っている -> 参加する側になる
      role = 2;
      matchId = uid();
      opponentName = lobby.name || '相手';
      await sset('sumo:lobby', {id:null, name:null, ts:0});
      await sset('sumo:invite:' + lobby.id, {matchId, opponentName: myName, ts: Date.now()});
      await createMatchState(matchId);
      startAsFollower();
    } else {
      // 自分が待つ側になる
      role = 1;
      waitingSince = now;
      await sset('sumo:lobby', {id: myId, name: myName, ts: now});
      pollInvite();
    }
  }

  function pollInvite(){
    clearInterval(inviteTimer);
    inviteTimer = setInterval(async ()=>{
      if (cancelled){ clearInterval(inviteTimer); return; }
      const inv = await sget('sumo:invite:' + myId);
      if (inv && inv.matchId && inv.ts >= waitingSince){
        clearInterval(inviteTimer);
        matchId = inv.matchId;
        opponentName = inv.opponentName || '相手';
        startAsAuthority();
      }
    }, 1000);
  }

  let cpuDifficulty = 'normal';
  const CPU_PARAMS = {
    easy:   {minGap:1200, maxGap:2200, aimNoise:0.9, minPower:0.3, maxPower:0.6},
    normal: {minGap:700,  maxGap:1600, aimNoise:0.5, minPower:0.5, maxPower:1.0},
    hard:   {minGap:400,  maxGap:900,  aimNoise:0.2, minPower:0.7, maxPower:1.0}
  };
  document.querySelectorAll('.cpuDiffBtn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const v = nameInput.value.trim();
      myName = v || ('力士' + Math.floor(Math.random()*900+100));
      cpuDifficulty = btn.dataset.diff;
      startCpuMatch();
    });
  });

  function startCpuMatch(){
    cpuMode = true;
    role = 1;
    matchId = null;
    const diffLabel = {easy:'弱い', normal:'普通', hard:'強い'}[cpuDifficulty] || '普通';
    opponentName = 'CPU(' + diffLabel + ')';
    localState = {
      p1:{x:-70,y:0,vx:0,vy:0,hp:100,staggeredUntil:0},
      p2:{x:70,y:0,vx:0,vy:0,hp:100,staggeredUntil:0},
      status:'playing',
      winner:null,
      lastEvent:null,
      names:{p1:myName, p2:opponentName},
      updatedAt: Date.now()
    };
    setupMatchUI();
    lastSeenOppSeq = 0;
    scheduleCpuAction();
    simTimer = setInterval(simTick, 150);
    renderTimer = setInterval(()=>render(localState), 150);
  }

  function scheduleCpuAction(){
    const p = CPU_PARAMS[cpuDifficulty] || CPU_PARAMS.normal;
    cpuNextActionAt = Date.now() + p.minGap + Math.random()*(p.maxGap - p.minGap);
  }

  function cpuMaybeAct(){
    if (Date.now() < cpuNextActionAt) return;
    scheduleCpuAction();
    const p = CPU_PARAMS[cpuDifficulty] || CPU_PARAMS.normal;
    const fwd = vecToward('p2','p1');
    const sides = sideVectors(fwd);
    const dist = Math.hypot(localState.p1.x-localState.p2.x, localState.p1.y-localState.p2.y);
    const p1TowardMe = -(localState.p1.vx*fwd.x + localState.p1.vy*fwd.y);
    const skillChance = {easy:0.15, normal:0.35, hard:0.55}[cpuDifficulty] || 0.3;
    let vec = sides.front;
    if (dist < MIN_DIST*1.3 && Math.random() < skillChance){
      vec = sides.right; // 上手投げ狙い
    } else if (p1TowardMe > 3 && Math.random() < skillChance){
      vec = sides.left; // はたき込み狙い
    } else if (dist < MIN_DIST*1.5 && Math.random() < skillChance*0.5){
      vec = sides.back; // 引き技狙い
    }
    const dx = vec.x + (Math.random()-0.5)*p.aimNoise*0.4;
    const dy = vec.y + (Math.random()-0.5)*p.aimNoise*0.4;
    const power = p.minPower + Math.random()*(p.maxPower - p.minPower);
    performTechnique('p2', dx, dy, power);
  }

  document.getElementById('cancelSearchBtn').addEventListener('click', async ()=>{
    cancelled = true;
    clearInterval(inviteTimer);
    const lobby = await sget('sumo:lobby');
    if (lobby && lobby.id === myId){
      await sset('sumo:lobby', {id:null, name:null, ts:0});
    }
    show('nameScreen');
  });

  async function createMatchState(id){
    localState = {
      p1:{x:-70,y:0,vx:0,vy:0,hp:100,staggeredUntil:0},
      p2:{x:70,y:0,vx:0,vy:0,hp:100,staggeredUntil:0},
      status:'playing',
      winner:null,
      lastEvent:null,
      names:{p1: role===1?myName:opponentName, p2: role===2?myName:opponentName},
      updatedAt: Date.now()
    };
    await sset('sumo:match:' + id + ':state', localState);
  }

  // ---------- match setup ----------
  function setupMatchUI(){
    document.getElementById('myLabel').textContent = myName + (role===1 ? '(先手)' : '(後手)');
    document.getElementById('oppLabel').textContent = opponentName;
    document.getElementById('statusLine').textContent = 'はっけよい、のこった!';
    show('matchScreen');
    resetControlsUI();
  }

  function startAsAuthority(){
    setupMatchUI();
    lastSeenOppSeq = 0;
    simTimer = setInterval(simTick, 150);
    renderTimer = setInterval(()=>render(localState), 150);
  }

  function startAsFollower(){
    setupMatchUI();
    lastStateSeenAt = Date.now();
    renderTimer = setInterval(pollAndRenderFollower, 180);
    clearInterval(staleWatchTimer);
    staleWatchTimer = setInterval(()=>{
      if (Date.now() - lastStateSeenAt > 8000){
        document.getElementById('statusLine').textContent = '対戦相手との通信が途絶えました…';
      }
    }, 2000);
  }

  async function pollAndRenderFollower(){
    const s = await sget('sumo:match:' + matchId + ':state');
    if (!s) return;
    lastStateSeenAt = Date.now();
    render(s);
    if (s.status !== 'playing'){
      clearInterval(renderTimer);
      clearInterval(staleWatchTimer);
      endMatch(s);
    }
  }

  // ---------- physics (authority only) ----------
  function simTick(){
    if (!localState || localState.status !== 'playing') return;

    if (cpuMode){
      cpuMaybeAct();
    } else {
      // 相手(role2)の入力を確認
      sget('sumo:match:' + matchId + ':input2').then(inp=>{
        if (inp){
          remoteInput2 = { dx: inp.dx||0, dy: inp.dy||0 };
          if (inp.releaseSeq && inp.releaseSeq !== lastSeenOppSeq){
            lastSeenOppSeq = inp.releaseSeq;
            performTechnique('p2', inp.releaseDx, inp.releaseDy, inp.releasePower);
          }
        }
      });
    }

    stepPhysics();
    if (!cpuMode){
      sset('sumo:match:' + matchId + ':state', localState);
    }

    if (localState.status !== 'playing'){
      clearInterval(simTimer);
      clearInterval(renderTimer);
      endMatch(localState);
    }
  }

  function staminaFactor(hp){
    return 0.4 + 0.6 * Math.max(0, Math.min(100, hp)) / 100; // HP0でも4割の力は出せる
  }

  function classifySector(idx, idy, fwd){
    const len = Math.hypot(idx, idy);
    if (len < 0.15) return 'front';
    const ndx = idx/len, ndy = idy/len;
    const dot = ndx*fwd.x + ndy*fwd.y;
    const cross = ndx*fwd.y - ndy*fwd.x;
    const angle = Math.atan2(cross, dot) * 180/Math.PI;
    const a = Math.abs(angle);
    if (a <= 45) return 'front';
    if (a >= 135) return 'back';
    return angle > 0 ? 'left' : 'right';
  }

  function sideVectors(fwd){
    const back = {x:-fwd.x, y:-fwd.y};
    const candA = {x: fwd.y, y: -fwd.x};
    const candB = {x: -fwd.y, y: fwd.x};
    const isLeft = classifySector(candA.x, candA.y, fwd) === 'left';
    return { front: fwd, back, left: isLeft ? candA : candB, right: isLeft ? candB : candA };
  }

  function vecToward(meWho, oppWho){
    const me = localState[meWho], opp = localState[oppWho];
    const dx = opp.x - me.x, dy = opp.y - me.y;
    const len = Math.hypot(dx,dy) || 1;
    return {x: dx/len, y: dy/len};
  }

  function setEvent(actor, type){
    if (localState) localState.lastEvent = {actor, type, ts: Date.now()};
  }

  // 技の判定と適用。role1(権威)が自分の技と、相手から届いた技の両方をここで処理する
  function performTechnique(who, rawDx, rawDy, power){
    if (!localState || localState.status !== 'playing') return;
    const oppWho = who === 'p1' ? 'p2' : 'p1';
    const me = localState[who], opp = localState[oppWho];
    const now = Date.now();
    const fwd = vecToward(who, oppWho);
    let idx = rawDx, idy = rawDy;
    if (Math.hypot(idx, idy) < 0.15){ idx = fwd.x; idy = fwd.y; }
    const sector = classifySector(idx, idy, fwd);
    const maxForce = 17;
    const stagMul = (me.staggeredUntil && me.staggeredUntil > now) ? 0.35 : 1;
    const effPower = Math.max(0.2, Math.min(1, power)) * stagMul * staminaFactor(me.hp);
    const dist = Math.hypot(opp.x - me.x, opp.y - me.y);

    function push(target, vx, vy){ target.vx += vx; target.vy += vy; }

    if (sector === 'front'){
      if (power < 0.35){
        push(me, fwd.x*maxForce*0.55*effPower, fwd.y*maxForce*0.55*effPower);
        if (dist < MIN_DIST*1.3) opp.staggeredUntil = now + 150;
        setEvent(who, 'jab');
      } else {
        push(me, fwd.x*maxForce*effPower, fwd.y*maxForce*effPower);
        setEvent(who, 'push');
      }
    } else if (sector === 'back'){
      const adjacent = dist < MIN_DIST*1.6;
      if (adjacent){
        push(opp, -fwd.x*maxForce*0.9*effPower, -fwd.y*maxForce*0.9*effPower);
        opp.staggeredUntil = now + 500;
        push(me, -fwd.x*maxForce*0.3*effPower, -fwd.y*maxForce*0.3*effPower);
        setEvent(who, 'hiki_hit');
      } else {
        push(me, -fwd.x*maxForce*0.2*effPower, -fwd.y*maxForce*0.2*effPower);
        setEvent(who, 'hiki_miss');
      }
    } else if (sector === 'left'){
      const oppApproach = -(opp.vx*fwd.x + opp.vy*fwd.y);
      if (oppApproach > 3){
        const dir = sideVectors(fwd).left;
        push(opp, dir.x*maxForce*1.1*effPower, dir.y*maxForce*1.1*effPower);
        opp.vx *= 0.2; opp.vy *= 0.2;
        opp.staggeredUntil = now + 600;
        setEvent(who, 'hataki_hit');
      } else {
        me.staggeredUntil = now + 300;
        const dir = sideVectors(fwd).left;
        push(me, dir.x*maxForce*0.15*effPower, dir.y*maxForce*0.15*effPower);
        setEvent(who, 'hataki_miss');
      }
    } else if (sector === 'right'){
      const adjacent = dist < MIN_DIST*1.15;
      if (adjacent){
        let dir = {x:opp.x, y:opp.y};
        const dlen = Math.hypot(dir.x, dir.y);
        dir = dlen < 5 ? fwd : {x:dir.x/dlen, y:dir.y/dlen};
        push(opp, dir.x*maxForce*1.3*effPower, dir.y*maxForce*1.3*effPower);
        opp.staggeredUntil = now + 400;
        me.staggeredUntil = now + 250;
        push(me, -dir.x*maxForce*0.2*effPower, -dir.y*maxForce*0.2*effPower);
        setEvent(who, 'nage_hit');
      } else {
        me.staggeredUntil = now + 300;
        setEvent(who, 'nage_miss');
      }
    }
  }

  function stepPhysics(){
    applyWalk('p1', myInput);
    applyWalk('p2', cpuMode ? {dx:0,dy:0} : remoteInput2);
    ['p1','p2'].forEach(k=>{
      const s = localState[k];
      s.vx *= 0.90; s.vy *= 0.90;
      s.x += s.vx; s.y += s.vy;
    });
    resolveCollision();
    checkOutcome();
    localState.updatedAt = Date.now();
  }

  const WALK_FORCE = 0.6;
  function applyWalk(who, inputVec){
    const len = Math.hypot(inputVec.dx, inputVec.dy);
    if (len < 0.05) return;
    const nx = inputVec.dx/len, ny = inputVec.dy/len;
    const mag = Math.min(1, len);
    const factor = WALK_FORCE * mag * staminaFactor(localState[who].hp);
    localState[who].vx += nx*factor;
    localState[who].vy += ny*factor;
  }

  function resolveCollision(){
    const a = localState.p1, b = localState.p2;
    const dx = b.x - a.x, dy = b.y - a.y;
    const dist = Math.hypot(dx,dy) || 0.01;
    const minDist = MIN_DIST;
    if (dist < minDist){
      const nx = dx/dist, ny = dy/dist;
      const overlap = minDist - dist;
      a.x -= nx*overlap*0.6; a.y -= ny*overlap*0.6;
      b.x += nx*overlap*0.6; b.y += ny*overlap*0.6;

      const aApproach = Math.max(0, a.vx*nx + a.vy*ny);
      const bApproach = Math.max(0, -(b.vx*nx + b.vy*ny));
      // 軽い接触(もみ合い)ではダメージを与えず、一定以上の勢いでぶつかった時だけダメージ
      const IMPACT_THRESHOLD = 1.2;
      const dmgToA = Math.max(0, bApproach - IMPACT_THRESHOLD) * 2.4;
      const dmgToB = Math.max(0, aApproach - IMPACT_THRESHOLD) * 2.4;
      a.hp = Math.max(0, a.hp - dmgToA);
      b.hp = Math.max(0, b.hp - dmgToB);

      const relVx = b.vx - a.vx, relVy = b.vy - a.vy;
      const relSpeed = relVx*nx + relVy*ny;
      const bounce = 0.8;
      a.vx += nx*relSpeed*bounce*0.5; a.vy += ny*relSpeed*bounce*0.5;
      b.vx -= nx*relSpeed*bounce*0.5; b.vy -= ny*relSpeed*bounce*0.5;
    }
  }

  function checkOutcome(){
    if (localState.status !== 'playing') return;
    const pairs = [['p1','p2'],['p2','p1']];
    for (const [me, other] of pairs){
      const s = localState[me];
      const d = Math.hypot(s.x, s.y);
      if (d > R_RING - R_PLAYER*0.35){
        localState.status = other + '_win';
        localState.winner = other;
        return;
      }
    }
  }

  // ---------- controls ----------
  const stickZone = document.getElementById('stickZone');
  const stickKnob = document.getElementById('stickKnob');
  const pushBtn = document.getElementById('pushBtn');
  const chargeFill = document.getElementById('chargeFill');

  let stickActive = false;
  let stickCenter = {x:0,y:0};
  const STICK_R = 29;

  function resetControlsUI(){
    stickKnob.style.left = '29px';
    stickKnob.style.top = '29px';
    chargeFill.style.height = '0%';
    pushBtn.classList.remove('charging');
    myInput.dx = 0; myInput.dy = 0;
  }

  function stickPointerDown(e){
    stickActive = true;
    const rect = stickZone.getBoundingClientRect();
    stickCenter = {x: rect.left + rect.width/2, y: rect.top + rect.height/2};
    stickZone.setPointerCapture(e.pointerId);
    stickMove(e);
  }
  function stickMove(e){
    if (!stickActive) return;
    let dx = e.clientX - stickCenter.x;
    let dy = e.clientY - stickCenter.y;
    const len = Math.hypot(dx,dy);
    if (len > STICK_R){ dx = dx/len*STICK_R; dy = dy/len*STICK_R; }
    stickKnob.style.left = (33 + dx) + 'px';
    stickKnob.style.top = (33 + dy) + 'px';
    myInput.dx = dx / STICK_R;
    myInput.dy = dy / STICK_R;
    sendInputThrottled();
  }
  function stickUp(){
    stickActive = false;
    stickKnob.style.left = '29px';
    stickKnob.style.top = '29px';
    myInput.dx = 0; myInput.dy = 0;
    sendInputThrottled(true);
  }
  stickZone.addEventListener('pointerdown', stickPointerDown);
  stickZone.addEventListener('pointermove', stickMove);
  stickZone.addEventListener('pointerup', stickUp);
  stickZone.addEventListener('pointercancel', stickUp);

  function sendInputThrottled(force){
    const now = Date.now();
    if (!force && now - lastInputSentAt < 150) return;
    lastInputSentAt = now;
    if (role === 2){
      sset('sumo:match:' + matchId + ':input2', {...myInput});
    }
    // role1(権威)は自分の入力をローカルで直接使うので送信不要
  }

  let chargeStart = 0;
  let chargeRAF = null;
  const MAX_CHARGE_MS = 1100;

  function startCharge(){
    chargeStart = Date.now();
    pushBtn.classList.add('charging');
    tickCharge();
  }
  function tickCharge(){
    const elapsed = Date.now() - chargeStart;
    const pct = Math.min(1, elapsed / MAX_CHARGE_MS);
    chargeFill.style.height = (pct*100) + '%';
    if (pushBtn.classList.contains('charging')){
      chargeRAF = requestAnimationFrame(tickCharge);
    }
  }
  function releaseCharge(){
    if (!pushBtn.classList.contains('charging')) return;
    pushBtn.classList.remove('charging');
    cancelAnimationFrame(chargeRAF);
    const elapsed = Date.now() - chargeStart;
    const power = Math.min(1, elapsed / MAX_CHARGE_MS);
    chargeFill.style.height = '0%';
    const dx = myInput.dx || 0.001;
    const dy = myInput.dy;
    localReleaseSeq++;
    const payload = { dx, dy, releaseSeq: localReleaseSeq, releaseDx: dx, releaseDy: dy, releasePower: power };
    if (role === 1){
      performTechnique('p1', dx, dy, power);
    } else {
      sset('sumo:match:' + matchId + ':input2', payload);
    }
  }
  pushBtn.addEventListener('pointerdown', (e)=>{ pushBtn.setPointerCapture(e.pointerId); startCharge(); });
  pushBtn.addEventListener('pointerup', releaseCharge);
  pushBtn.addEventListener('pointercancel', releaseCharge);

  // ---------- render ----------
  const canvas = document.getElementById('ring');
  const ctx = canvas.getContext('2d');

  const EVENT_TEXT = {
    jab:        ['突っ張りを放った!', '相手が突っ張ってきた!'],
    hiki_hit:   ['引き落としが決まった!', '引き落としで崩された!'],
    hiki_miss:  ['引き技が空振りした…', '相手の引き技が空振りした']
    ,hataki_hit:['はたき込みが決まった!', 'はたき込みで崩された!'],
    hataki_miss:['はたき込みが空振り、体勢を崩した…', '相手のはたき込みが空振りした'],
    nage_hit:   ['上手投げが決まった!', '上手投げで投げられた!'],
    nage_miss:  ['投げが不発、体勢を崩した…', '相手の投げが不発だった']
  };

  function statusText(state){
    const ev = state.lastEvent;
    if (!ev || Date.now() - ev.ts > 1500) return 'はっけよい、のこった!';
    const dict = EVENT_TEXT[ev.type];
    if (!dict) return 'はっけよい、のこった!';
    const isMe = ev.actor === (role === 1 ? 'p1' : 'p2');
    return isMe ? dict[0] : dict[1];
  }

  function render(state){
    if (!state) return;
    const w = canvas.width, h = canvas.height;
    const scale = (Math.min(w,h)/2 - 10) / R_RING;
    const cx = w/2, cy = h/2;

    ctx.clearRect(0,0,w,h);

    // dohyo base
    ctx.fillStyle = '#E7D9BC';
    ctx.fillRect(0,0,w,h);

    // ring (clay)
    ctx.beginPath();
    ctx.arc(cx, cy, R_RING*scale, 0, Math.PI*2);
    ctx.fillStyle = '#D9AE78';
    ctx.fill();
    ctx.lineWidth = 8;
    ctx.strokeStyle = '#7A4A24';
    ctx.stroke();

    // center line
    ctx.strokeStyle = '#00000022';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(cx - 30*scale, cy); ctx.lineTo(cx + 30*scale, cy);
    ctx.stroke();

    // players
    drawPlayer(state.p1, cx, cy, scale, '#2C4A6E');
    drawPlayer(state.p2, cx, cy, scale, '#B8402B');

    // hp bars
    const p1El = document.getElementById(role===1 ? 'myHpFill' : 'oppHpFill');
    const p2El = document.getElementById(role===2 ? 'myHpFill' : 'oppHpFill');
    p1El.style.width = Math.max(0,state.p1.hp) + '%';
    p2El.style.width = Math.max(0,state.p2.hp) + '%';

    document.getElementById('statusLine').textContent = statusText(state);
  }

  function drawPlayer(p, cx, cy, scale, color){
    const x = cx + p.x*scale, y = cy + p.y*scale;
    const staggered = p.staggeredUntil && p.staggeredUntil > Date.now();
    ctx.beginPath();
    ctx.arc(x, y, R_PLAYER*scale, 0, Math.PI*2);
    ctx.fillStyle = color;
    ctx.globalAlpha = staggered ? 0.55 : 1;
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.lineWidth = staggered ? 4 : 3;
    ctx.strokeStyle = staggered ? '#C79A3C' : '#fffdf8';
    ctx.stroke();
  }

  // ---------- end / result ----------
  function endMatch(state){
    const iWon = (role===1 && state.winner==='p1') || (role===2 && state.winner==='p2');
    const word = document.getElementById('resultWord');
    const hint = document.getElementById('resultHint');
    word.textContent = iWon ? '勝ち' : '負け';
    word.className = 'resultWord ' + (iWon ? 'win' : 'lose');
    hint.textContent = iWon
      ? (opponentName + 'を土俵から押し出して勝利しました。')
      : (opponentName + 'に土俵から押し出されて敗れました。');
    show('resultScreen');
  }

  document.getElementById('rematchBtn').addEventListener('click', ()=>{
    clearInterval(simTimer); clearInterval(renderTimer); clearInterval(staleWatchTimer);
    const wasCpu = cpuMode;
    localState = null; matchId = null; role = null; cpuMode = false;
    resetControlsUI();
    if (wasCpu){
      startCpuMatch();
    } else {
      findMatch();
    }
  });

})();
</script>
</body>
